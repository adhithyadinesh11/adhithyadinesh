<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery • Adhithya Dinesh</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/gallery.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@300;400;500;600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

<div class="page-fade">

    <nav class="navbar">

        <a href="index.html#home">HOME</a>

        <a href="index.html#about">ABOUT</a>

        <a href="index.html#achievements">ACHIEVEMENTS</a>

        <a href="index.html#featured">FEATURED</a>

        <a href="gallery.html" class="active">GALLERY</a>

        <a href="index.html#contact">CONTACT</a>

</nav>

    <main class="gallery-page">

        <!-- ==========================================
             HEADER
        ========================================== -->

        <section class="gallery-header">

            <div class="gallery-top">

                <div>

                    <p class="gallery-label">GALLERY</p>

                    <h1>BEHIND THE PODIUM</h1>

                </div>

                <a href="index.html" class="watch-link">
                    &larr; BACK TO SITE
                </a>

            </div>

            <div class="archive-tabs" role="tablist">

                <button
                    type="button"
                    class="archive-tab is-active"
                    role="tab"
                    aria-selected="true"
                    aria-controls="panel-photos"
                    data-panel="photos">
                    PHOTOS
                </button>

                <button
                    type="button"
                    class="archive-tab"
                    role="tab"
                    aria-selected="false"
                    aria-controls="panel-videos"
                    data-panel="videos">
                    VIDEOS
                </button>

            </div>

        </section>


        <!-- ==========================================
             PHOTOS  (generated by gallery.js)
        ========================================== -->

        <div class="archive-panel is-active" id="panel-photos" role="tabpanel">

            <section id="featured-photo"></section>

            <section id="gallery-grid"></section>

        </div>


        <!-- ==========================================
             VIDEOS  (generated by gallery.js)
        ========================================== -->

        <div class="archive-panel" id="panel-videos" role="tabpanel">

            <section id="video-list"></section>

        </div>

    </main>

</div>


<!-- ==========================================
     PHOTO LIGHTBOX
========================================== -->

<div id="lightbox">

    <button class="lightbox-close" type="button" aria-label="Close">
        &times;
    </button>

    <button class="lightbox-prev" type="button" aria-label="Previous photo">
        &#10094;
    </button>

    <img id="lightbox-image" src="" alt="">

    <button class="lightbox-next" type="button" aria-label="Next photo">
        &#10095;
    </button>

    <div class="lightbox-info">
        <h2></h2>
        <p></p>
    </div>

</div>


<!-- ==========================================
     VIDEO PLAYER
========================================== -->

<div id="video-player">

    <span class="close-player" role="button" tabindex="0" aria-label="Close player">
        &times;
    </span>

    <video id="fullscreen-video" controls playsinline></video>

    <div class="video-info">
        <h2></h2>
        <p></p>
    </div>

</div>


<script src="assets/js/script.js"></script>
<script src="assets/js/gallery.js?v=2"></script>

</body>

</html>
